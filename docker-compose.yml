# The gateway and its database. vLLM runs separately on a GPU host and is
# reached over VLLM_URL — putting it here would imply this stack is deployable
# on a machine that cannot serve the model.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MODEL: ${MODEL:?set MODEL}
      VLLM_URL: ${VLLM_URL:-http://host.docker.internal:8000/v1}
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
